# CV Sketch — WordPress + MariaDB/MySQL + Redis object cache
# Deploy step (cvsketch_sync) pulls the plugin from GitHub and installs the
# object-cache drop-in, so the container always runs the current release.

services:
  cvsketch_sync:
    image: alpine/git:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        HTML=/var/www/html
        P="$$HTML/wp-content/plugins"
        LOG="$$HTML/cv-sync.log"
        exec >"$$LOG" 2>&1
        echo "== cv-sketch sync $$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "git: $$(git --version 2>&1)"
        mkdir -p "$$P"
        TMP="$$(mktemp -d)"
        echo "-- cloning"
        if git clone --depth 1 https://github.com/Mavasikona/cv-sketch.git "$$TMP/repo"; then
          echo "-- clone ok"
        else
          echo "-- git clone failed, trying tarball"
          if wget -q -O "$$TMP/cv.tar.gz" https://codeload.github.com/Mavasikona/cv-sketch/tar.gz/refs/heads/master; then
            tar -xzf "$$TMP/cv.tar.gz" -C "$$TMP" && mv "$$TMP/cv-sketch-master" "$$TMP/repo" && echo "-- tarball ok"
          else
            echo "-- tarball failed too; keeping existing plugin"
          fi
        fi
        if [ -f "$$TMP/repo/cv-sketch.php" ]; then
          rm -rf "$$P/cv-sketch.old"
          [ -d "$$P/cv-sketch" ] && mv "$$P/cv-sketch" "$$P/cv-sketch.old"
          mv "$$TMP/repo" "$$P/cv-sketch"
          echo "-- plugin in place: $$(ls "$$P/cv-sketch" | tr '\n' ' ')"
          sh "$$P/cv-sketch/deploy/sync.sh"
        else
          echo "-- no plugin files obtained"
        fi
        echo "-- plugins dir:"; ls -la "$$P" 2>&1
        rm -rf "$$TMP"
    volumes:
      - wp_app:/var/www/html
    restart: "no"

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
    restart: unless-stopped
    volumes:
      - wp_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  wordpress:
    image: wordpress:latest
    # Resolve the site's own domain to the Traefik container instead of the
    # server's public IP. Loopback requests (REST API, WP-Cron, Site Health)
    # otherwise depend on hairpin NAT, which times out on many hosts
    # (cURL error 28). See https://github.com/Dokploy/templates/issues/128
    command:
      - bash
      - -c
      - |
        if [ -n "$$WP_DOMAIN" ]; then
          (
            for i in $$(seq 1 60); do
              TRAEFIK_IP="$$(getent hosts dokploy-traefik | awk '{print $$1; exit}')"
              if [ -n "$$TRAEFIK_IP" ]; then
                grep -q "[[:space:]]$$WP_DOMAIN\$$" /etc/hosts || echo "$$TRAEFIK_IP $$WP_DOMAIN" >> /etc/hosts
                break
              fi
              sleep 2
            done
          ) &
        fi
        exec docker-entrypoint.sh apache2-foreground
    volumes:
      - wp_app:/var/www/html
      - ../files/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      WORDPRESS_DB_HOST: wp_db
      WORDPRESS_DB_NAME: $DB_NAME
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: $DB_PASSWORD
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-0}
      WP_DOMAIN: ${WP_DOMAIN}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '256M');
        define('DISALLOW_FILE_EDIT', true);
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_PREFIX', 'cvsketch:');
        define('WP_REDIS_MAXTTL', 86400);
    depends_on:
      wp_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      cvsketch_sync:
        condition: service_completed_successfully
    restart: unless-stopped

  wp_db:
    image: mysql:8.4
    restart: unless-stopped
    volumes:
      - wp_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: $DB_PASSWORD
      MYSQL_DATABASE: $DB_NAME
    healthcheck:
      test: ["CMD-SHELL", "exit | mysql -h localhost -P 3306 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  wp_app:
  wp_data:
  wp_redis:
